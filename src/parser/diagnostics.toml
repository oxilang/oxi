[unexpected_token]
level = "Fatal"
message = "Unexpected token `{actual}`"

[expected_token]
level = "Fatal"
message = "Expected `{expected}` but received `{actual}` instead."

[expected_identifier]
level = "Fatal"
message = "Expected identifier, found `{actual}`"

[expected_comma_or_closing_paren]
level = "Fatal"
message = "Expected `,` or `)` but received `{actual}` instead."

[expected_top_level]
level = "Fatal"
message = "Expected top-level item, but found `{actual}` instead."

[struct_method_missing_body]
level = "Error"
message = "Associated functions in structs must have a body"

[struct_assoc_type_missing_body]
level = "Error"
message = "Associated types in structs must have a body"

[field_already_defined]
level = "Error"
message = "Field `{field}` has already been defined in struct `{struct}`"

[trait_method_has_body]
level = "Error"
message = "Expected trait method to not have a body"

[trait_assoc_type_has_body]
level = "Error"
message = "Expected trait associated type to not have a body"

[expected_term_or_body_after_signature]
level = "Fatal"
message = "Expected function body or terminator after signature"

[impl_method_missing_body]
level = "Error"
message = "Methods in impl items must have a body"

[impl_type_missing_body]
level = "Error"
message = "Associated types in impl items must have a body"

[const_item_without_value]
level = "Warning"
message = "Declared a constant without providing a value"

[unknown_escape_sequence]
level = "Warning"
message = "Unknown escape sequence `\\{c}`"

[attribute_not_allowed_here]
level = "Error"
message = "Attribute not allowed here"

[modifier_not_allowed_here]
level = "Error"
message = "Modifier not allowed here"

[unexpected_modifier]
level = "Error"
message = "Unexpected modifier `{modifier}`"

[duplicate_modifier]
level = "Error"
message = "Duplicate modifier `{modifier}`"

[modifier_must_appear_before]
level = "Error"
message = "Modifier `{modifier}` must appear before `{previous}`"
